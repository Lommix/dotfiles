set -ga terminal-overrides ",xterm-256color*:Tc"
set -s escape-time 0
set -g mouse on

set-option -g default-shell /usr/bin/fish

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mouse on
set -g base-index 1
set-window-option -g mode-keys vi

set-option -g set-clipboard on

bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -sel clipboard"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# vim-like pane switching
bind r source-file ~/.tmux.conf ; display-message "config reloaded"
bind -r ^ last-window
unbind-key -q !
unbind-key -q -n M-!
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -r m resize-pane -Z

bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# bind -r z switch-client -l
# bind -r b switch-client -p

# statusbar
set -g status-left-length 40
set -g status-style bg=#0B0E14
set -g status-left "#[fg=#0B0E14,bg=#FF8F40,bold] #S #[default] "
set -g window-status-separator " "
set -g window-status-format "#[fg=#BFBDB6,bg=#1F2430] #I #W #[default]"
set -g window-status-current-format "#[fg=#0B0E14,bg=#39BAE6,bold] #I #W #[default]"
set -g status-right '#(gitmux "#{pane_current_path}")'
set -g status-justify left

set -g pane-border-lines double
set -g pane-border-style 'fg=#3B4252'
set -g pane-active-border-style 'fg=#88C0D0'
set -g pane-border-indicators arrows

bind-key -r o run-shell "tmux neww ~/.local/bin/tmux_sessionizer.sh"
